name: Studio boundary

# Studio is allowed in this fork only while it stays additive: the moment it edits a file the
# upstream also maintains, cherry-picking upstream fixes starts conflicting. See AGENTS.md.
on:
  pull_request:
    paths:
      - "apps/studio/**"
      - "packages/studio/**"

jobs:
  additive-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject edits to upstream-maintained files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          violations=$(git diff --name-only "$base" "$head" \
            | grep -E '^(apps/web/|packages/lib/src/db/schema\.ts|packages/lib/src/db/migrations/|packages/ui/|turbo\.json|packages/config/src/env-registry\.ts)' || true)
          if [ -n "$violations" ]; then
            echo "This PR touches Studio and also edits upstream-maintained files:"
            echo "$violations"
            echo
            echo "See the Studio boundary table in AGENTS.md. Split the change into two PRs if the"
            echo "platform edit is genuinely needed on its own merits."
            exit 1
          fi
          echo "Additive only — no upstream-maintained files touched."
